model:
  backbone: chexfound
  weights: reference_code/baseline/CheXFound/teacher_checkpoint.pth
  image_height: 896
  image_width: 448
  normalization: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  adapter: {enabled: true, type: lora, rank: 8, alpha: 16, dropout: 0.05, target_modules: [qkv]}
training:
  batch_size: 1
  epochs: 50
  learning_rate: 0.001
  head_learning_rate: 0.001
  adapter_learning_rate: 0.00005
  weight_decay: 0.01
  warmup_epochs: 5
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  workers: 2
  seed: 42
  early_stopping: {enabled: true, patience: 10, min_delta: 0.0}
output_dir: outputs/downstream/task07_keypoint_lora/chexfound_public
