model:
  backbone: cxformer
  weights: reference_code/baseline/CXFormer
  image_size: 518
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  freeze_backbone: true
  adapter:
    enabled: true
    type: lora
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules:
    - query
    - key
    - value
    - q
    - k
    - v
training:
  batch_size: 1
  epochs: 100
  learning_rate: 0.001
  adapter_learning_rate: 0.0001
  weight_decay: 0.01
  workers: 4
  seed: 42
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0
output_dir: outputs/downstream/task09_lora/cxformer_public
