model:
  backbone: medical_mae
  weights: reference_code/baseline/medical_MAE/vit-b_CXR_0.5M_mae.pth
  image_size: 512
  normalization: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  adapter: {enabled: true, type: lora, rank: 8, alpha: 16, dropout: 0.05, target_modules: [qkv]}
training:
  batch_size: 2
  epochs: 50
  learning_rate: 0.001
  head_learning_rate: 0.001
  adapter_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_epochs: 5
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  workers: 4
  seed: 42
  early_stopping: {enabled: true, patience: 10, min_delta: 0.0}
output_dir: outputs/downstream/task09_lora/medical_mae_public
