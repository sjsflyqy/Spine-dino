# Spine-DINO continual pretraining from SpinePretrain-v1 WebDataset shards.
train:
  dataset_path: "SpineWebDataset:shards=../../SpinePretrain-v1/shards/train-*.tar"
  batch_size_per_gpu: 16
  num_workers: 8
  OFFICIAL_EPOCH_LENGTH: 500
  output_dir: ../../outputs/spine_dino_webdataset
  saveckp_freq: 10
  seed: 42
  cache_dataset: false
  centering: "centering"

student:
  arch: vit_base
  patch_size: 14
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  drop_path_uniform: true
  pretrained_weights: ''
  ffn_layer: "mlp"
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 0
  interpolate_antialias: false
  interpolate_offset: 0.1

teacher:
  momentum_teacher: 0.994
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 5

optim:
  epochs: 50
  weight_decay: 0.04
  weight_decay_end: 0.2
  base_lr: 0.001
  lr: 0.
  warmup_epochs: 5
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  global_crops_scale: [0.32, 1.0]
  local_crops_number: 8
  local_crops_scale: [0.05, 0.32]
  global_crops_size: 224
  local_crops_size: 98

evaluation:
  eval_period_iterations: 1000
